[package]
name = "rembrandt-server"
version = "0.1.0"
edition = "2021"
description = "Serves Rembrandt and a folder of photos to your browser"
license-file = "../LICENSE"
publish = false

# No dependencies on purpose: easy to audit, easy to build for every platform.
[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
