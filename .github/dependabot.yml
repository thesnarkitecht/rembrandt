# Keeps the pinned GitHub Actions and the Rust dependencies up to date (weekly pull requests).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /server
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
