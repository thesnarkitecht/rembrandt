# Checks every push and pull request: JavaScript syntax and imports, the installer script, and the
# server (build and tests). The desktop apps are built by release.yml.
name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: npm run check
      - run: bash -n install.sh && shellcheck -S warning install.sh
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: cargo test --manifest-path server/Cargo.toml
      - run: cargo build --release --manifest-path server/Cargo.toml
