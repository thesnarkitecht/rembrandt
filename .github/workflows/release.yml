# Builds Rembrandt for every platform and publishes a GitHub release.
#
#   Desktop app  macOS Apple silicon (.dmg), macOS Intel (.dmg), Windows x64 (.exe, .msi),
#                Windows ARM64 (.exe), Linux x86_64 and arm64 (.AppImage, .deb, .rpm, PKGBUILD)
#   Server       rembrandt-server for Linux x86_64/arm64 (static), macOS arm64/x64, Windows x64/arm64,
#                each bundled with the web app
#
# Runs on version tags (v*) and publishes the release; a manual run builds everything and keeps
# the files as workflow artifacts only.
#
# Signing (optional; unsigned builds work but macOS and Windows warn on first open):
#   macOS    APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows  WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
name: Release
permissions:
  contents: read
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            server: macos-aarch64
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
            server: macos-x86_64
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
            server: windows-x86_64
          - name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
            server: windows-aarch64
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage
            server: linux-x86_64
            musl: x86_64-unknown-linux-musl
          - name: Linux arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: --target aarch64-unknown-linux-gnu --bundles deb,rpm,appimage
            server: linux-aarch64
            musl: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}${{ matrix.musl && format(',{0}', matrix.musl) || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri\nserver" }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf musl-tools
      - run: npm ci
      - run: npm run check
      - name: Windows signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $cert = Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          Remove-Item cert.pfx
          "WINDOWS_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the desktop app
        shell: bash
        env:
          LUMEN_CONFIG_JS: ${{ vars.LUMEN_CONFIG_JS }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Empty secrets must be unset, or the bundler tries to use a blank certificate.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID LUMEN_CONFIG_JS; do
            [ -n "${!v:-}" ] || unset "$v"
          done
          sign=()
          if [ -n "${WINDOWS_THUMBPRINT:-}" ]; then
            sign=(--config "{\"bundle\":{\"windows\":{\"certificateThumbprint\":\"$WINDOWS_THUMBPRINT\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.digicert.com\"}}}")
          fi
          npx tauri build ${{ matrix.args }} "${sign[@]}"
      - name: Build rembrandt-server
        shell: bash
        run: |
          target='${{ matrix.musl || matrix.target }}'
          cargo build --release --manifest-path server/Cargo.toml --target "$target"
          mkdir -p pkg/web
          cp -r dist/. pkg/web/
          cp LICENSE NOTICE.md TRADEMARKS.md pkg/
          if [ "$RUNNER_OS" = Windows ]; then
            cp "server/target/$target/release/rembrandt-server.exe" pkg/
          else
            cp "server/target/$target/release/rembrandt-server" pkg/
          fi
      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          b='src-tauri/target/${{ matrix.target }}/release/bundle'
          # Copy the first file matching a pattern, if this platform produced one.
          pick() { for f in $1; do if [ -e "$f" ]; then cp "$f" "out/$2"; echo "$2"; fi; break; done; }
          case '${{ matrix.server }}' in
            macos-aarch64)   pick "$b/dmg/*.dmg" Rembrandt-macos-arm64.dmg ;;
            macos-x86_64)    pick "$b/dmg/*.dmg" Rembrandt-macos-x64.dmg ;;
            windows-x86_64)  pick "$b/nsis/*-setup.exe" Rembrandt-windows-x64-setup.exe; pick "$b/msi/*.msi" Rembrandt-windows-x64.msi ;;
            windows-aarch64) pick "$b/nsis/*-setup.exe" Rembrandt-windows-arm64-setup.exe ;;
            linux-x86_64)    pick "$b/appimage/*.AppImage" Rembrandt-linux-x86_64.AppImage; pick "$b/deb/*.deb" Rembrandt-linux-amd64.deb; pick "$b/rpm/*.rpm" Rembrandt-linux-x86_64.rpm ;;
            linux-aarch64)   pick "$b/appimage/*.AppImage" Rembrandt-linux-aarch64.AppImage; pick "$b/deb/*.deb" Rembrandt-linux-arm64.deb; pick "$b/rpm/*.rpm" Rembrandt-linux-aarch64.rpm ;;
          esac
          s='rembrandt-server-${{ matrix.server }}'
          if [ "$RUNNER_OS" = Windows ]; then (cd pkg && 7z a -tzip "../out/$s.zip" . >/dev/null); echo "$s.zip"
          else tar -czf "out/$s.tar.gz" -C pkg .; echo "$s.tar.gz"; fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: rembrandt-${{ matrix.server }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl, pattern: rembrandt-*, merge-multiple: true }
      - name: Checksums and Arch package recipe
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd dl
          DEB_SHA=$(sha256sum Rembrandt-linux-amd64.deb | cut -d' ' -f1)
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$DEB_SHA/" ../packaging/arch/PKGBUILD.in > PKGBUILD
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dl/* --title "Rembrandt ${GITHUB_REF_NAME#v}" --generate-notes
