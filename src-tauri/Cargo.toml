[package]
name = "lumen"
version = "0.3.35"
description = "Rembrandt photo editor"
authors = ["Rembrandt contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = { version = "1", features = ["parallel"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 2.6.2 doesn't compile on Linux (it builds ini::ParseOption without the fields rust-ini 0.21.3 added).
tauri-plugin-deep-link = ">=2, <2.6.4"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
jpeg-decoder = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.11"
# Content Credentials in exports (src/credentials.rs). Pure Rust crypto: no OpenSSL to ship.
c2pa = { version = "=0.91.11", default-features = false, features = ["rust_native_crypto"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
# GPU benchmark (src/gpubench.rs): the editor's main colour stage on the native GPU API, to compare
# with the web view's WebGL before building a native renderer.
wgpu = "=30.0.1"
pollster = "1.0"

# The system web view on Linux: its graphics acceleration is set explicitly (see lib.rs).
# libloading: libgphoto2 for tethering, opened when tethering starts (src/tether/gphoto.rs).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
libloading = "0.8"

# Generative Remove natively (src/inpaint.rs): ONNX Runtime with Core ML, prebuilt for Apple silicon.
# Elsewhere the web app's WebAssembly version (the prebuilt Linux library needs glibc 2.38 and a newer
# libstdc++ than the builds and many systems have; Windows would need DirectML shipped).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "coreml"] }

# Tethering on macOS with ImageCaptureCore (src/tether/mac.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue"] }
objc2-image-capture-core = { version = "0.3", features = ["block2", "objc2-core-graphics", "libc"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGImage"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
